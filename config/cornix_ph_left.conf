# LEDs for the Cornix halves (WS2812 x2 on SPI3, powered through EXT_POWER).
# Kept in per-board files because config/cornix.conf is also picked up by the
# dongle build, which is a bare nice_nano with no LED strip - enabling underglow
# there fails with "A zmk,underglow chosen node must be declared".
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y
