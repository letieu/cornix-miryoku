# Kconfig for the Cornix halves (applies to cornix_left, cornix_right and
# cornix_ph_left, because they all live in boards/jzf/cornix/).
#
# Miryoku's MOUSE layer uses ZMK's mouse-move / mouse-scroll / mouse-button
# behaviors (&mmv, &msc, &mkp). Their sources are only compiled in when the
# pointing subsystem is enabled - without this line the mouse layer is dead.
CONFIG_ZMK_POINTING=y
