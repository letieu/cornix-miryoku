# Kconfig for the Cornix halves (applies to cornix_left, cornix_right and
# cornix_ph_left, because they all live in boards/jzf/cornix/).
#
# Miryoku's MOUSE layer uses ZMK's mouse-move / mouse-scroll / mouse-button
# behaviors (&mmv, &msc, &mkp). Their sources are only compiled in when the
# pointing subsystem is enabled - without this line the mouse layer is dead.
CONFIG_ZMK_POINTING=y

# ZMK Studio: runtime keymap editing over USB (https://zmk.studio), the closest
# thing to Vial on this firmware. Needs the studio-rpc-usb-uart snippet, which
# build.yaml and scripts/build-local.sh pass. Studio edits live in NVS, so the
# compiled keymap only re-applies after "Restore Stock Settings" in Studio.
CONFIG_ZMK_STUDIO=y

# The cornix_indicator LEDs show the battery of each half: on boot each part
# blinks its own level, and the central also blinks the peripheral's level so a
# single key press (&ind_bat on the left palm) reports both halves.
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
