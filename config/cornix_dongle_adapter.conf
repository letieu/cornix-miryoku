# The dongle build (board nice_nano + shield cornix_dongle_adapter).
#
# The adapter shield's own .conf already enables CONFIG_ZMK_POINTING (it is the
# split central, i.e. the side that emits the mouse HID reports), so nothing to
# add here for the MOUSE layer.
#
# It also enables CONFIG_ZMK_DISPLAY, but the display lives on the optional
# `cornix_dongle_eyelash` shield. Without that overlay there is no
# `zephyr,display` device and the build fails on `src/display/main.c`. A
# Miryoku dongle does not need a screen, so turn the display off; drop this line
# (and add the eyelash shield) if your dongle has one.
CONFIG_ZMK_DISPLAY=n
