manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: hitsmaxft
      url-base: https://github.com/hitsmaxft

  projects:
    # ZMK main (Zephyr 4.1 baseline, required by the Cornix board definitions)
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # Cornix board + shield definitions
    - name: zmk-keyboard-cornix
      remote: hitsmaxft
      revision: main

    # Battery / split-connection LED indicators (cornix_indicator shield)
    - name: zmk-rgbled-widget
      remote: hitsmaxft
      revision: main

  self:
    path: config
